<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双摆混沌模拟器 | Double Pendulum Simulator</title>
<style>
  :root{
    --bg:#1a1a24;
    --ink:#94a3b8;
    --ink-strong:#e2e8f0;
    --accent:#38bdf8;
    --accent2:#22d3ee;
    --panel:rgba(30,32,48,0.72);
    --line:rgba(56,189,248,0.25);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    overflow:hidden;
    font-family:"Inter","Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #stage{display:block;width:100vw;height:calc(100vh - 96px);cursor:grab;touch-action:none;}
  #stage.dragging{cursor:grabbing;}

  .hud{
    position:fixed;top:20px;left:20px;
    padding:16px 18px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    box-shadow:0 10px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
    font-size:12px;
    line-height:1.7;
    letter-spacing:.02em;
    min-width:246px;
    user-select:none;
  }
  .hud h1{
    font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
    color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:8px;
  }
  .hud h1 .dot{
    width:7px;height:7px;border-radius:50%;background:var(--accent2);
    box-shadow:0 0 8px var(--accent2);animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.8);}}
  .row{display:flex;justify-content:space-between;gap:24px;}
  .row .k{color:#64748b;}
  .row .v{color:var(--ink-strong);font-variant-numeric:tabular-nums;font-family:ui-monospace,"SF Mono",Consolas,monospace;}
  .row.hl .v{color:var(--accent2);}
  .divider{height:1px;background:var(--line);margin:10px 0;}
  .tips{
    position:fixed;bottom:112px;left:50%;transform:translateX(-50%);
    display:flex;gap:18px;font-size:11px;letter-spacing:.06em;color:#4b5568;
    user-select:none;white-space:nowrap;
  }
  .tips b{color:#7f8ea3;font-weight:600;}
  .badge{
    position:fixed;top:20px;right:20px;
    padding:8px 14px;border-radius:10px;
    background:var(--panel);border:1px solid var(--line);
    font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#64748b;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);user-select:none;
  }

  /* ============ 底部参数面板 ============ */
  .panel{
    position:fixed;left:0;right:0;bottom:0;height:96px;z-index:10;
    background:linear-gradient(180deg, rgba(26,26,36,0.55), rgba(20,20,30,0.94));
    border-top:1px solid var(--line);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    display:flex;align-items:center;justify-content:center;gap:30px;padding:0 28px;
  }
  .ctrl{display:flex;flex-direction:column;gap:8px;min-width:178px;flex:0 0 auto;}
  .ctrl label{
    font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#94a3b8;
    display:flex;justify-content:space-between;align-items:baseline;gap:14px;
  }
  .ctrl .val{
    color:var(--accent2);font-family:ui-monospace,"SF Mono",Consolas,monospace;
    font-size:11px;letter-spacing:0;text-transform:none;
    font-variant-numeric:tabular-nums;
  }
  .ctrl input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:4px;
    background:linear-gradient(90deg, rgba(56,189,248,0.55), rgba(56,189,248,0.12));
    border-radius:2px;outline:none;cursor:pointer;
  }
  .ctrl input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;
    background:var(--accent2);
    box-shadow:0 0 0 3px rgba(34,211,238,0.18), 0 0 12px rgba(34,211,238,0.55);
    cursor:grab;transition:transform .12s;
  }
  .ctrl input[type=range]::-webkit-slider-thumb:active{cursor:grabbing;transform:scale(1.12);}
  .ctrl input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border-radius:50%;background:var(--accent2);border:none;
    box-shadow:0 0 0 3px rgba(34,211,238,0.18), 0 0 12px rgba(34,211,238,0.55);
    cursor:grab;
  }
  .btn{
    padding:10px 22px;border-radius:10px;
    background:linear-gradient(180deg, rgba(56,189,248,0.20), rgba(56,189,248,0.08));
    border:1px solid rgba(56,189,248,0.45);
    color:var(--ink-strong);font-size:11px;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;
    cursor:pointer;transition:all .15s;font-family:inherit;min-width:120px;
  }
  .btn:hover{
    background:linear-gradient(180deg, rgba(56,189,248,0.32), rgba(56,189,248,0.14));
    border-color:rgba(56,189,248,0.8);
    box-shadow:0 0 18px rgba(56,189,248,0.35);
    color:#ffffff;
  }
  .btn:active{transform:translateY(1px);}

  @media (max-width:720px){
    .hud{min-width:0;font-size:11px;padding:12px 14px;}
    .tips{gap:10px;font-size:10px;bottom:170px;}
    .panel{flex-wrap:wrap;height:auto;padding:14px 16px;gap:14px;}
    .ctrl{min-width:140px;flex:1 1 140px;}
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="hud">
  <h1><span class="dot"></span>Double Pendulum · 双摆</h1>
  <div class="row"><span class="k">摆长 l₁ = l₂</span><span class="v" id="v-len">—</span></div>
  <div class="row"><span class="k">质量 m₁ = m₂</span><span class="v">1.00 kg</span></div>
  <div class="row"><span class="k">重力 g</span><span class="v" id="v-g">—</span></div>
  <div class="row"><span class="k">初始角 θ₁₀ = θ₂₀</span><span class="v" id="v-th0">—</span></div>
  <div class="divider"></div>
  <div class="row hl"><span class="k">角度 θ₁ / θ₂</span><span class="v" id="v-th">—</span></div>
  <div class="row hl"><span class="k">角速度 ω₁ / ω₂</span><span class="v" id="v-om">—</span></div>
  <div class="row"><span class="k">机械能 E</span><span class="v" id="v-E">—</span></div>
  <div class="row"><span class="k">能量漂移 |ΔE|</span><span class="v" id="v-dE">—</span></div>
</div>

<div class="badge">Canvas · RK4 · 无依赖</div>
<div class="tips">
  <span><b>拖动</b> 任一摆球改变角度</span>
  <span><b>空格</b> 暂停 / 继续</span>
  <span><b>R / 按钮</b> 重置</span>
</div>

<aside class="panel" aria-label="参数控制面板">
  <div class="ctrl">
    <label>总摆长 L<span class="val" id="vl-len">260 px</span></label>
    <input type="range" id="s-len" min="100" max="350" step="1" value="260">
  </div>
  <div class="ctrl">
    <label>重力 g<span class="val" id="vl-g">9.80 m/s²</span></label>
    <input type="range" id="s-g" min="1" max="25" step="0.1" value="9.8">
  </div>
  <div class="ctrl">
    <label>阻尼 c<span class="val" id="vl-d">0.0000</span></label>
    <input type="range" id="s-d" min="0" max="0.010" step="0.0001" value="0">
  </div>
  <button id="btn-reset" class="btn" type="button">重置摆动</button>
</aside>

<script>
(function(){
  'use strict';

  /* ================= 初始参数 ================= */
  const PANEL_H = 96;                          // 与 CSS .panel 高度保持一致
  const CFG = {
    totalLen: 260,        // 总摆长 px（l1 = l2 = totalLen / 2）
    g: 9.8,               // 重力加速度 m/s²
    ppm: 100,             // 像素/米 映射
    theta0Deg: 90,        // 初始角：RK4 实测 90° 起步 60s 内球2 过顶 12 次
                          //（45° 起步 E=11.2J，球2 无法过顶，不满足翻转验收）
    damping: 0.0,         // 阻尼系数（0 = 保守系统）
    r1: 15,               // 球1 半径 px
    r2: 18,               // 球2 半径 px（彩虹主角）
    trail: 300            // 彩虹拖尾采样点数
  };
  const M1 = 1, M2 = 1;                       // 两摆质量 kg

  /* ================= Canvas 初始化 ================= */
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, OX = 0, OY = 0;
  let L1m = 0, L2m = 0;                       // 物理摆长（米），由滑块联动

  function syncLengths(){
    const half = (CFG.totalLen / 2) / CFG.ppm;
    L1m = half;
    L2m = half;
  }

  function fitStage(){
    const top = 100;
    const bottomMargin = CFG.r2 + 24;
    const maxOY = H - CFG.totalLen - bottomMargin;
    OY = Math.max(top, Math.min(H * 0.28, maxOY));
  }

  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight - PANEL_H;
    canvas.width  = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    OX = W / 2;
    fitStage();
  }
  window.addEventListener('resize', resize);

  /* ================= 双摆物理：状态与方程 ================= */
  // 状态向量 y = [θ1, ω1, θ2, ω2]，角度自竖直向下量取
  const THETA0 = CFG.theta0Deg * Math.PI / 180;
  let y = [THETA0, 0, THETA0, 0];
  let simT = 0;                                // 仿真累计时间（驱动色相流动）
  let E0 = 0;                                  // 能量基准（用于漂移监测）
  const trailPts = [];                         // {x, y, hue}

  let paused = false;
  let dragBall = 0;                            // 0=无拖拽, 1=拖球1, 2=拖球2

  // 双摆显式微分方程组（经典拉格朗日推导结果）：
  //   分母 den = 2m1 + m2 − m2·cos(2(θ1−θ2)) ≥ 2m1 > 0，无奇点
  function derivs(y){
    const t1 = y[0], w1 = y[1], t2 = y[2], w2 = y[3];
    const d  = t1 - t2;
    const sd = Math.sin(d), cd = Math.cos(d);
    const den = 2*M1 + M2 - M2 * Math.cos(2*d);
    const a1 = ( -CFG.g * (2*M1 + M2) * Math.sin(t1)
                 - M2 * CFG.g * Math.sin(t1 - 2*t2)
                 - 2 * sd * M2 * (w2*w2 * L2m + w1*w1 * L1m * cd)
               ) / (L1m * den) - CFG.damping * w1;
    const a2 = ( 2 * sd * ( w1*w1 * L1m * (M1 + M2)
                 + CFG.g * (M1 + M2) * Math.cos(t1)
                 + w2*w2 * L2m * M2 * cd )
               ) / (L2m * den) - CFG.damping * w2;
    return [w1, a1, w2, a2];
  }

  // 机械能（最低点位能取 0）
  function energy(){
    const t1 = y[0], w1 = y[1], t2 = y[2], w2 = y[3];
    const v1sq = L1m*L1m * w1*w1;
    const v2sq = L1m*L1m * w1*w1 + L2m*L2m * w2*w2 + 2*L1m*L2m * w1*w2 * Math.cos(t1 - t2);
    const ke = 0.5*M1*v1sq + 0.5*M2*v2sq;
    const pe = -(M1 + M2)*CFG.g*L1m*Math.cos(t1) - M2*CFG.g*L2m*Math.cos(t2)
               + (M1 + M2)*CFG.g*L1m + M2*CFG.g*L2m;
    return ke + pe;
  }

  /* ================= RK4 数值积分（四阶龙格-库塔） ================= */
  function rk4Step(y, dt){
    const k1 = derivs(y);
    const yA = [y[0] + k1[0]*dt/2, y[1] + k1[1]*dt/2, y[2] + k1[2]*dt/2, y[3] + k1[3]*dt/2];
    const k2 = derivs(yA);
    const yB = [y[0] + k2[0]*dt/2, y[1] + k2[1]*dt/2, y[2] + k2[2]*dt/2, y[3] + k2[3]*dt/2];
    const k3 = derivs(yB);
    const yC = [y[0] + k3[0]*dt, y[1] + k3[1]*dt, y[2] + k3[2]*dt, y[3] + k3[3]*dt];
    const k4 = derivs(yC);
    const out = new Array(4);
    for(let i = 0; i < 4; i++){
      out[i] = y[i] + dt/6 * (k1[i] + 2*k2[i] + 2*k3[i] + k4[i]);
    }
    return out;
  }

  const FIXED = 1 / 300;                       // 300 Hz 固定物理步长
  let acc = 0;

  function reset(){
    y = [THETA0, 0, THETA0, 0];
    simT = 0;
    trailPts.length = 0;
    E0 = energy();
  }

  // 统一重置入口：复位状态 + 恢复运行 + 校正时间戳
  function resetAnimation(){
    reset();
    paused = false;
    dragBall = 0;
    last = performance.now();
    acc = 0;
  }

  /* ================= 几何位置 ================= */
  function pivot1(){
    const l = CFG.totalLen / 2;
    return { x: OX + l * Math.sin(y[0]), y: OY + l * Math.cos(y[0]) };
  }
  function pivot2(){
    const p1 = pivot1();
    const l = CFG.totalLen / 2;
    return { x: p1.x + l * Math.sin(y[2]), y: p1.y + l * Math.cos(y[2]) };
  }

  /* ================= 渲染 ================= */
  function drawBackground(){
    ctx.fillStyle = '#1a1a24';
    ctx.fillRect(0, 0, W, H);

    const g1 = ctx.createRadialGradient(OX, OY + CFG.totalLen * 0.5, 0, OX, OY + CFG.totalLen * 0.5, Math.max(W, H) * 0.75);
    g1.addColorStop(0, 'rgba(56,189,248,0.055)');
    g1.addColorStop(1, 'rgba(26,26,36,0)');
    ctx.fillStyle = g1;
    ctx.fillRect(0, 0, W, H);

    const step = 48;
    ctx.strokeStyle = 'rgba(56,189,248,0.045)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for(let x = OX % step; x < W; x += step){ ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for(let yy = OY % step; yy < H; yy += step){ ctx.moveTo(0, yy); ctx.lineTo(W, yy); }
    ctx.stroke();

    const g2 = ctx.createRadialGradient(OX, H * 0.45, Math.min(W, H) * 0.25, OX, H * 0.45, Math.max(W, H) * 0.85);
    g2.addColorStop(0, 'rgba(0,0,0,0)');
    g2.addColorStop(1, 'rgba(0,0,0,0.45)');
    ctx.fillStyle = g2;
    ctx.fillRect(0, 0, W, H);
  }

  function drawReference(){
    ctx.save();
    ctx.setLineDash([4, 8]);
    ctx.strokeStyle = 'rgba(148,163,184,0.18)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(OX, OY);
    ctx.lineTo(OX, OY + CFG.totalLen + CFG.r2 + 26);
    ctx.stroke();
    ctx.restore();
  }

  // 彩虹渐变衰减拖尾：色相随时间流动，alpha/线宽沿拖尾平方衰减
  function drawTrail(){
    const n = trailPts.length;
    if(n < 2) return;
    ctx.lineCap = 'round';
    for(let i = 1; i < n; i++){
      const p0 = trailPts[i - 1], p1 = trailPts[i];
      const k = i / n;                          // 0=尾 1=头（越新越亮）
      ctx.strokeStyle = 'hsla(' + p1.hue + ',100%,62%,' + (k * k * 0.55).toFixed(3) + ')';
      ctx.lineWidth = 0.6 + k * 2.6;
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.stroke();
    }
  }

  function drawRods(p1, p2, hue){
    // 杆1：支点 → 球1（青蓝系）
    let grad = ctx.createLinearGradient(OX, OY, p1.x, p1.y);
    grad.addColorStop(0, 'rgba(148,163,184,0.85)');
    grad.addColorStop(1, 'rgba(56,189,248,0.95)');
    ctx.strokeStyle = grad;
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(OX, OY);
    ctx.lineTo(p1.x, p1.y);
    ctx.stroke();

    // 杆2：球1 → 球2（末端融入球2当前色相）
    grad = ctx.createLinearGradient(p1.x, p1.y, p2.x, p2.y);
    grad.addColorStop(0, 'rgba(148,163,184,0.75)');
    grad.addColorStop(1, 'hsla(' + hue + ',95%,65%,0.95)');
    ctx.strokeStyle = grad;
    ctx.lineWidth = 2.0;
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();
  }

  function drawPivot(){
    const gl = ctx.createRadialGradient(OX, OY, 0, OX, OY, 26);
    gl.addColorStop(0, 'rgba(56,189,248,0.35)');
    gl.addColorStop(1, 'rgba(56,189,248,0)');
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(OX, OY, 26, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#0f172a';
    ctx.beginPath(); ctx.arc(OX, OY, 9, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(148,163,184,0.9)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#94a3b8';
    ctx.beginPath(); ctx.arc(OX, OY, 3, 0, Math.PI * 2); ctx.fill();
  }

  // 球1：青蓝发光（沿用单摆质感）
  function drawBob1(x, y_){
    const r = CFG.r1;
    const glow = ctx.createRadialGradient(x, y_, 0, x, y_, r * 4);
    glow.addColorStop(0,   'rgba(34,211,238,0.34)');
    glow.addColorStop(0.45,'rgba(56,189,248,0.10)');
    glow.addColorStop(1,   'rgba(56,189,248,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(x, y_, r * 4, 0, Math.PI * 2); ctx.fill();

    const body = ctx.createRadialGradient(x - r*0.35, y_ - r*0.38, r*0.08, x, y_, r*1.05);
    body.addColorStop(0,    '#f0fdff');
    body.addColorStop(0.32, '#7dd3fc');
    body.addColorStop(0.75, '#0ea5e9');
    body.addColorStop(1,    '#075985');
    ctx.save();
    ctx.shadowBlur = 18;
    ctx.shadowColor = 'rgba(34,211,238,0.8)';
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(x, y_, r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.ellipse(x - r*0.32, y_ - r*0.36, r*0.24, r*0.17, -0.6, 0, Math.PI * 2);
    ctx.fill();
  }

  // 球2：彩虹主角色（hue 随仿真时间流动）
  function drawBob2(x, y_, hue){
    const r = CFG.r2;
    const glow = ctx.createRadialGradient(x, y_, 0, x, y_, r * 4.4);
    glow.addColorStop(0,   'hsla(' + hue + ',100%,66%,0.40)');
    glow.addColorStop(0.45,'hsla(' + hue + ',100%,60%,0.11)');
    glow.addColorStop(1,   'hsla(' + hue + ',100%,60%,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(x, y_, r * 4.4, 0, Math.PI * 2); ctx.fill();

    const body = ctx.createRadialGradient(x - r*0.35, y_ - r*0.38, r*0.08, x, y_, r*1.05);
    body.addColorStop(0,    '#ffffff');
    body.addColorStop(0.32, 'hsl(' + hue + ',95%,74%)');
    body.addColorStop(0.75, 'hsl(' + hue + ',90%,52%)');
    body.addColorStop(1,    'hsl(' + hue + ',85%,30%)');
    ctx.save();
    ctx.shadowBlur = 24;
    ctx.shadowColor = 'hsla(' + hue + ',100%,60%,0.9)';
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(x, y_, r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath();
    ctx.ellipse(x - r*0.32, y_ - r*0.36, r*0.24, r*0.17, -0.6, 0, Math.PI * 2);
    ctx.fill();
  }

  function render(){
    drawBackground();
    drawReference();

    const hue = (simT * 40) % 360;             // 色相流速 40°/s
    const p1 = pivot1(), p2 = pivot2();

    drawTrail();
    drawRods(p1, p2, hue);
    drawPivot();
    drawBob1(p1.x, p1.y);
    drawBob2(p2.x, p2.y, hue);
  }

  /* ================= HUD ================= */
  const el = {
    len: document.getElementById('v-len'),
    g:   document.getElementById('v-g'),
    th0: document.getElementById('v-th0'),
    th:  document.getElementById('v-th'),
    om:  document.getElementById('v-om'),
    E:   document.getElementById('v-E'),
    dE:  document.getElementById('v-dE')
  };
  el.th0.textContent = CFG.theta0Deg.toFixed(1) + '°';

  const fmtDeg = rad => {
    let d = (rad * 180 / Math.PI) % 360;
    if(d > 180) d -= 360;
    if(d < -180) d += 360;
    return (d >= 0 ? '+' : '') + d.toFixed(1) + '°';
  };

  function updateHUD(){
    el.len.textContent = (CFG.totalLen / 2).toFixed(0) + ' px ×2 (' + L1m.toFixed(2) + ' m)';
    el.g.textContent   = CFG.g.toFixed(2) + ' m/s²';
    el.th.textContent  = fmtDeg(y[0]) + ' / ' + fmtDeg(y[2]);
    el.om.textContent  = y[1].toFixed(2) + ' / ' + y[3].toFixed(2) + ' rad/s';

    const E = energy();
    el.E.textContent  = E.toFixed(3) + ' J';
    el.dE.textContent = Math.abs(E - E0).toExponential(1) + ' J';
  }

  /* ================= 主循环：requestAnimationFrame ================= */
  let last = performance.now();

  function frame(now){
    const dtReal = Math.min((now - last) / 1000, 0.05);
    last = now;

    if(!paused && !dragBall){
      acc += dtReal;
      let guard = 0;
      while(acc >= FIXED && guard++ < 600){
        y = rk4Step(y, FIXED);
        simT += FIXED;
        acc -= FIXED;
      }
      const p2 = pivot2();
      trailPts.push({ x: p2.x, y: p2.y, hue: (simT * 40) % 360 });
      if(trailPts.length > CFG.trail) trailPts.shift();
    }

    render();
    updateHUD();
    requestAnimationFrame(frame);
  }

  /* ================= 鼠标拖拽：直接抓取摆球 ================= */
  function pointerPos(e){
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  canvas.addEventListener('pointerdown', e => {
    const m = pointerPos(e);
    const p1 = pivot1(), p2 = pivot2();
    const d1 = Math.hypot(m.x - p1.x, m.y - p1.y);
    const d2 = Math.hypot(m.x - p2.x, m.y - p2.y);
    const th1 = CFG.r1 * 3.2, th2 = CFG.r2 * 3.2;
    if(d2 < th2 && d2 <= d1){
      dragBall = 2;                            // 优先抓外侧彩虹球
    }else if(d1 < th1){
      dragBall = 1;
    }else{
      return;
    }
    paused = false;
    acc = 0;
    trailPts.length = 0;
    canvas.classList.add('dragging');
    try { canvas.setPointerCapture(e.pointerId); } catch(_){}
  });

  canvas.addEventListener('pointermove', e => {
    if(!dragBall) return;
    const m = pointerPos(e);
    if(dragBall === 1){
      // 抓球1：θ1 由鼠标相对支点方位决定，θ2 保持
      y[0] = Math.atan2(m.x - OX, m.y - OY);
      y[1] = 0;
      y[3] = 0;
    }else{
      // 抓球2：θ2 由鼠标相对球1 当前位置方位决定
      const p1 = pivot1();
      y[2] = Math.atan2(m.x - p1.x, m.y - p1.y);
      y[1] = 0;
      y[3] = 0;
    }
  });

  function endDrag(e){
    if(!dragBall) return;
    dragBall = 0;
    canvas.classList.remove('dragging');
    E0 = energy();                             // 释放后以当前能量为新基准
    try { canvas.releasePointerCapture(e.pointerId); } catch(_){}
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  window.addEventListener('keydown', e => {
    if(e.code === 'Space'){ e.preventDefault(); paused = !paused; last = performance.now(); }
    if(e.key === 'r' || e.key === 'R'){ resetAnimation(); }
  });

  /* ================= 控件绑定：滑块 + 重置按钮 ================= */
  const sLen = document.getElementById('s-len');
  const sG   = document.getElementById('s-g');
  const sD   = document.getElementById('s-d');
  const vLen = document.getElementById('vl-len');
  const vG   = document.getElementById('vl-g');
  const vD   = document.getElementById('vl-d');
  const btn  = document.getElementById('btn-reset');

  function syncLenLabel(){ vLen.textContent = CFG.totalLen.toFixed(0) + ' px'; }
  function syncGLabel(){ vG.textContent = CFG.g.toFixed(2) + ' m/s²'; }
  function syncDLabel(){ vD.textContent = CFG.damping.toFixed(4); }

  sLen.addEventListener('input', () => {
    CFG.totalLen = parseFloat(sLen.value);
    syncLengths();
    fitStage();
    E0 = energy();                             // 摆长改变 → 能量基准重记
    syncLenLabel();
  });
  sG.addEventListener('input', () => {
    CFG.g = parseFloat(sG.value);
    E0 = energy();                             // 重力改变 → 能量基准重记
    syncGLabel();
  });
  sD.addEventListener('input', () => {
    CFG.damping = parseFloat(sD.value);
    syncDLabel();
  });
  btn.addEventListener('click', resetAnimation);

  // 作用域说明：内联 onclick 处理器在全局作用域求值，无法访问 IIFE 内部
  // 标识符，故显式挂载到 window，使 addEventListener 与内联调用双通道兼容
  window.resetAnimation = resetAnimation;

  /* ================= 启动 ================= */
  syncLengths();
  syncLenLabel(); syncGLabel(); syncDLabel();
  resize();
  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
