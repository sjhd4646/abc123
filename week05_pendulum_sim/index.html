<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单摆简谐振动模拟器 | Pendulum Simulator</title>
<style>
  :root{
    --bg:#1a1a24;
    --ink:#94a3b8;
    --ink-strong:#e2e8f0;
    --accent:#38bdf8;
    --accent2:#22d3ee;
    --panel:rgba(30,32,48,0.72);
    --line:rgba(56,189,248,0.25);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    overflow:hidden;
    font-family:"Inter","Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #stage{display:block;width:100vw;height:calc(100vh - 96px);cursor:grab;touch-action:none;}
  #stage.dragging{cursor:grabbing;}

  .hud{
    position:fixed;top:20px;left:20px;
    padding:16px 18px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    box-shadow:0 10px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
    font-size:12px;
    line-height:1.7;
    letter-spacing:.02em;
    min-width:238px;
    user-select:none;
  }
  .hud h1{
    font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
    color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:8px;
  }
  .hud h1 .dot{
    width:7px;height:7px;border-radius:50%;background:var(--accent2);
    box-shadow:0 0 8px var(--accent2);animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.8);}}
  .row{display:flex;justify-content:space-between;gap:24px;}
  .row .k{color:#64748b;}
  .row .v{color:var(--ink-strong);font-variant-numeric:tabular-nums;font-family:ui-monospace,"SF Mono",Consolas,monospace;}
  .row.hl .v{color:var(--accent2);}
  .divider{height:1px;background:var(--line);margin:10px 0;}
  .tips{
    position:fixed;bottom:112px;left:50%;transform:translateX(-50%);
    display:flex;gap:18px;font-size:11px;letter-spacing:.06em;color:#4b5568;
    user-select:none;white-space:nowrap;
  }
  .tips b{color:#7f8ea3;font-weight:600;}
  .badge{
    position:fixed;top:20px;right:20px;
    padding:8px 14px;border-radius:10px;
    background:var(--panel);border:1px solid var(--line);
    font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#64748b;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);user-select:none;
  }

  /* ============ 底部参数面板 ============ */
  .panel{
    position:fixed;left:0;right:0;bottom:0;height:96px;z-index:10;
    background:linear-gradient(180deg, rgba(26,26,36,0.55), rgba(20,20,30,0.94));
    border-top:1px solid var(--line);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    display:flex;align-items:center;justify-content:center;gap:30px;padding:0 28px;
  }
  .ctrl{display:flex;flex-direction:column;gap:8px;min-width:178px;flex:0 0 auto;}
  .ctrl label{
    font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#94a3b8;
    display:flex;justify-content:space-between;align-items:baseline;gap:14px;
  }
  .ctrl .val{
    color:var(--accent2);font-family:ui-monospace,"SF Mono",Consolas,monospace;
    font-size:11px;letter-spacing:0;text-transform:none;
    font-variant-numeric:tabular-nums;
  }
  .ctrl input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:4px;
    background:linear-gradient(90deg, rgba(56,189,248,0.55), rgba(56,189,248,0.12));
    border-radius:2px;outline:none;cursor:pointer;
  }
  .ctrl input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;
    background:var(--accent2);
    box-shadow:0 0 0 3px rgba(34,211,238,0.18), 0 0 12px rgba(34,211,238,0.55);
    cursor:grab;transition:transform .12s;
  }
  .ctrl input[type=range]::-webkit-slider-thumb:active{cursor:grabbing;transform:scale(1.12);}
  .ctrl input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border-radius:50%;background:var(--accent2);border:none;
    box-shadow:0 0 0 3px rgba(34,211,238,0.18), 0 0 12px rgba(34,211,238,0.55);
    cursor:grab;
  }
  .btn{
    padding:10px 22px;border-radius:10px;
    background:linear-gradient(180deg, rgba(56,189,248,0.20), rgba(56,189,248,0.08));
    border:1px solid rgba(56,189,248,0.45);
    color:var(--ink-strong);font-size:11px;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;
    cursor:pointer;transition:all .15s;font-family:inherit;min-width:120px;
  }
  .btn:hover{
    background:linear-gradient(180deg, rgba(56,189,248,0.32), rgba(56,189,238,0.14));
    border-color:rgba(56,189,248,0.8);
    box-shadow:0 0 18px rgba(56,189,248,0.35);
    color:#ffffff;
  }
  .btn:active{transform:translateY(1px);}

  @media (max-width:720px){
    .hud{min-width:0;font-size:11px;padding:12px 14px;}
    .tips{gap:10px;font-size:10px;bottom:170px;}
    .panel{flex-wrap:wrap;height:auto;padding:14px 16px;gap:14px;}
    .ctrl{min-width:140px;flex:1 1 140px;}
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="hud">
  <h1><span class="dot"></span>Pendulum · 单摆</h1>
  <div class="row"><span class="k">摆长 L</span><span class="v" id="v-len">—</span></div>
  <div class="row"><span class="k">重力 g</span><span class="v" id="v-g">—</span></div>
  <div class="row"><span class="k">初始角 θ₀</span><span class="v" id="v-th0">—</span></div>
  <div class="divider"></div>
  <div class="row hl"><span class="k">实时角度 θ</span><span class="v" id="v-th">—</span></div>
  <div class="row hl"><span class="k">角速度 ω</span><span class="v" id="v-om">—</span></div>
  <div class="row"><span class="k">理论周期 T</span><span class="v" id="v-T">—</span></div>
  <div class="row"><span class="k">机械能 E</span><span class="v" id="v-E">—</span></div>
</div>

<div class="badge">Canvas · 原生无依赖</div>
<div class="tips">
  <span><b>拖动</b> 摆球调整角度</span>
  <span><b>空格</b> 暂停 / 继续</span>
  <span><b>R / 按钮</b> 重置</span>
</div>

<aside class="panel" aria-label="参数控制面板">
  <div class="ctrl">
    <label>摆长 L<span class="val" id="vl-len">200 px</span></label>
    <input type="range" id="s-len" min="100" max="350" step="1" value="200">
  </div>
  <div class="ctrl">
    <label>重力 g<span class="val" id="vl-g">9.80 m/s²</span></label>
    <input type="range" id="s-g" min="1" max="25" step="0.1" value="9.8">
  </div>
  <div class="ctrl">
    <label>阻尼 c<span class="val" id="vl-d">0.0000</span></label>
    <input type="range" id="s-d" min="0" max="0.010" step="0.0001" value="0">
  </div>
  <button id="btn-reset" class="btn" type="button">重置摆动</button>
</aside>

<script>
(function(){
  'use strict';

  /* ================= 初始参数 ================= */
  const PANEL_H = 96;                          // 与 CSS .panel 高度保持一致
  const CFG = {
    L: 200,               // 摆长（像素，用于绘制）
    g: 9.8,               // 重力加速度 m/s²
    ppm: 100,             // 像素/米 映射：200px → 2.00m
    theta0Deg: 45,        // 初始摆角（度）
    ballR: 21,            // 摆球半径 px
    damping: 0.0,         // 阻尼系数（0 = 理想无阻尼）
    trail: 90             // 轨迹采样点数
  };

  /* ================= Canvas 初始化 ================= */
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, OX = 0, OY = 0;
  let Lm = CFG.L / CFG.ppm;                    // 物理摆长（米），可被滑块改变

  function fitStage(){
    // 根据当前画布高度与摆长，自适应支点 OY，避免摆球越界
    const top = 100;                           // 顶部至少留 100px（避开 HUD）
    const bottomMargin = CFG.ballR + 24;       // 球底到 canvas 底的留白
    const maxOY = H - CFG.L - bottomMargin;
    OY = Math.max(top, Math.min(H * 0.28, maxOY));
  }

  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight - PANEL_H;
    canvas.width  = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    OX = W / 2;
    fitStage();
  }
  window.addEventListener('resize', resize);

  /* ================= 物理状态 ================= */
  const THETA0 = CFG.theta0Deg * Math.PI / 180;
  const state = { theta: THETA0, omega: 0, t: 0 };
  const trailPts = [];

  let paused = false;
  let dragging = false;

  // 完整非线性单摆方程：θ'' = -(g/L)·sinθ - c·θ'
  function angularAccel(theta){
    return -(CFG.g / Lm) * Math.sin(theta);
  }

  function reset(){
    state.theta = THETA0;
    state.omega = 0;
    state.t = 0;
    trailPts.length = 0;
  }

  /* ========== 固定步长积分（半隐式/辛欧拉，长期保能量） ========== */
  const FIXED = 1 / 300;
  let acc = 0;

  function physics(dt){
    const a = angularAccel(state.theta) - CFG.damping * state.omega;
    state.omega += a * dt;
    state.theta += state.omega * dt;
    state.t += dt;
  }

  /* ================= 渲染 ================= */
  function bobPos(theta){
    return { x: OX + CFG.L * Math.sin(theta), y: OY + CFG.L * Math.cos(theta) };
  }

  function drawBackground(){
    ctx.fillStyle = '#1a1a24';
    ctx.fillRect(0, 0, W, H);

    const g1 = ctx.createRadialGradient(OX, OY + CFG.L * 0.5, 0, OX, OY + CFG.L * 0.5, Math.max(W, H) * 0.75);
    g1.addColorStop(0, 'rgba(56,189,248,0.055)');
    g1.addColorStop(1, 'rgba(26,26,36,0)');
    ctx.fillStyle = g1;
    ctx.fillRect(0, 0, W, H);

    const step = 48;
    ctx.strokeStyle = 'rgba(56,189,248,0.045)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for(let x = OX % step; x < W; x += step){ ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for(let y = OY % step; y < H; y += step){ ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();

    const g2 = ctx.createRadialGradient(OX, H * 0.45, Math.min(W, H) * 0.25, OX, H * 0.45, Math.max(W, H) * 0.85);
    g2.addColorStop(0, 'rgba(0,0,0,0)');
    g2.addColorStop(1, 'rgba(0,0,0,0.45)');
    ctx.fillStyle = g2;
    ctx.fillRect(0, 0, W, H);
  }

  function drawReference(){
    ctx.save();
    ctx.setLineDash([4, 8]);
    ctx.strokeStyle = 'rgba(148,163,184,0.20)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(OX, OY);
    ctx.lineTo(OX, OY + CFG.L + CFG.ballR + 26);
    ctx.stroke();
    ctx.restore();

    if(Math.abs(state.theta) > 0.01){
      const R = CFG.L * 0.42;
      const start = Math.PI / 2;
      const end = Math.PI / 2 - state.theta;
      ctx.save();
      ctx.strokeStyle = 'rgba(56,189,248,0.30)';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(OX, OY, R, Math.min(start, end), Math.max(start, end));
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawTrail(){
    if(trailPts.length < 2) return;
    for(let i = 1; i < trailPts.length; i++){
      const p0 = trailPts[i - 1], p1 = trailPts[i];
      const k = i / trailPts.length;
      ctx.strokeStyle = 'rgba(34,211,238,' + (k * 0.30).toFixed(3) + ')';
      ctx.lineWidth = 1 + k * 2.2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.stroke();
    }
  }

  function drawRod(bx, by){
    const grad = ctx.createLinearGradient(OX, OY, bx, by);
    grad.addColorStop(0, 'rgba(148,163,184,0.85)');
    grad.addColorStop(1, 'rgba(56,189,248,0.95)');
    ctx.strokeStyle = grad;
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(OX, OY);
    ctx.lineTo(bx, by);
    ctx.stroke();
  }

  function drawPivot(){
    const gl = ctx.createRadialGradient(OX, OY, 0, OX, OY, 26);
    gl.addColorStop(0, 'rgba(56,189,248,0.35)');
    gl.addColorStop(1, 'rgba(56,189,248,0)');
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(OX, OY, 26, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#0f172a';
    ctx.beginPath(); ctx.arc(OX, OY, 9, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(148,163,184,0.9)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#94a3b8';
    ctx.beginPath(); ctx.arc(OX, OY, 3, 0, Math.PI * 2); ctx.fill();
  }

  function drawBob(bx, by){
    const r = CFG.ballR;

    const glow = ctx.createRadialGradient(bx, by, 0, bx, by, r * 4.2);
    glow.addColorStop(0,   'rgba(34,211,238,0.38)');
    glow.addColorStop(0.45,'rgba(56,189,248,0.11)');
    glow.addColorStop(1,   'rgba(56,189,248,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(bx, by, r * 4.2, 0, Math.PI * 2); ctx.fill();

    const body = ctx.createRadialGradient(bx - r * 0.35, by - r * 0.38, r * 0.08, bx, by, r * 1.05);
    body.addColorStop(0,    '#f0fdff');
    body.addColorStop(0.32, '#7dd3fc');
    body.addColorStop(0.75, '#0ea5e9');
    body.addColorStop(1,    '#075985');
    ctx.save();
    ctx.shadowBlur = 22;
    ctx.shadowColor = 'rgba(34,211,238,0.85)';
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.ellipse(bx - r * 0.32, by - r * 0.36, r * 0.24, r * 0.17, -0.6, 0, Math.PI * 2);
    ctx.fill();
  }

  function render(){
    drawBackground();
    drawReference();
    const p = bobPos(state.theta);
    drawTrail();
    drawRod(p.x, p.y);
    drawPivot();
    drawBob(p.x, p.y);
  }

  /* ================= HUD ================= */
  const el = {
    len: document.getElementById('v-len'),
    g:   document.getElementById('v-g'),
    th0: document.getElementById('v-th0'),
    th:  document.getElementById('v-th'),
    om:  document.getElementById('v-om'),
    T:   document.getElementById('v-T'),
    E:   document.getElementById('v-E')
  };
  el.th0.textContent = CFG.theta0Deg.toFixed(1) + '°';

  function updateHUD(){
    el.len.textContent = CFG.L + ' px (' + Lm.toFixed(2) + ' m)';
    el.g.textContent   = CFG.g.toFixed(2) + ' m/s²';
    const deg = state.theta * 180 / Math.PI;
    el.th.textContent = (deg >= 0 ? '+' : '') + deg.toFixed(2) + '°';
    el.om.textContent = state.omega.toFixed(3) + ' rad/s';

    const T = 2 * Math.PI * Math.sqrt(Lm / CFG.g);
    el.T.textContent = T.toFixed(3) + ' s';

    const v = Lm * state.omega;
    const E = 0.5 * v * v + CFG.g * Lm * (1 - Math.cos(state.theta));
    el.E.textContent = E.toFixed(3) + ' J';
  }

  /* ================= 主循环：requestAnimationFrame ================= */
  let last = performance.now();

  function frame(now){
    const dtReal = Math.min((now - last) / 1000, 0.05);
    last = now;

    if(!paused && !dragging){
      acc += dtReal;
      let guard = 0;
      while(acc >= FIXED && guard++ < 600){
        physics(FIXED);
        acc -= FIXED;
      }
      trailPts.push(bobPos(state.theta));
      if(trailPts.length > CFG.trail) trailPts.shift();
    }

    render();
    updateHUD();
    requestAnimationFrame(frame);
  }

  /* ================= 交互 ================= */
  function pointerPos(e){
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  canvas.addEventListener('pointerdown', e => {
    const m = pointerPos(e);
    const p = bobPos(state.theta);
    if(Math.hypot(m.x - p.x, m.y - p.y) <= CFG.ballR * 2.6){
      dragging = true;
      paused = false;
      acc = 0;
      trailPts.length = 0;
      canvas.classList.add('dragging');
      try { canvas.setPointerCapture(e.pointerId); } catch(_){}
    }
  });

  canvas.addEventListener('pointermove', e => {
    if(!dragging) return;
    const m = pointerPos(e);
    state.theta = Math.atan2(m.x - OX, m.y - OY);
    state.omega = 0;
  });

  function endDrag(e){
    if(!dragging) return;
    dragging = false;
    canvas.classList.remove('dragging');
    try { canvas.releasePointerCapture(e.pointerId); } catch(_){}
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  window.addEventListener('keydown', e => {
    if(e.code === 'Space'){ e.preventDefault(); paused = !paused; last = performance.now(); }
    if(e.key === 'r' || e.key === 'R'){ reset(); paused = false; }
  });

  /* ================= 控件绑定：滑块 + 重置按钮 ================= */
  const sLen = document.getElementById('s-len');
  const sG   = document.getElementById('s-g');
  const sD   = document.getElementById('s-d');
  const vLen = document.getElementById('vl-len');
  const vG   = document.getElementById('vl-g');
  const vD   = document.getElementById('vl-d');
  const btn  = document.getElementById('btn-reset');

  function syncLenLabel(){ vLen.textContent = CFG.L.toFixed(0) + ' px (' + Lm.toFixed(2) + ' m)'; }
  function syncGLabel(){ vG.textContent = CFG.g.toFixed(2) + ' m/s²'; }
  function syncDLabel(){ vD.textContent = CFG.damping.toFixed(4); }

  sLen.addEventListener('input', () => {
    CFG.L = parseFloat(sLen.value);
    Lm = CFG.L / CFG.ppm;
    fitStage();                       // 摆长变化时同步支点，避免越界
    syncLenLabel();
  });
  sG.addEventListener('input', () => {
    CFG.g = parseFloat(sG.value);
    syncGLabel();
  });
  sD.addEventListener('input', () => {
    CFG.damping = parseFloat(sD.value);
    syncDLabel();
  });
  btn.addEventListener('click', () => {
    reset();                          // 球回 45°，角速度清零，轨迹清空
    paused = false;
    last = performance.now();
  });

  /* ================= 启动 ================= */
  syncLenLabel(); syncGLabel(); syncDLabel();
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
